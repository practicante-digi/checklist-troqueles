<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Manager - Troqueles</title>
  <link rel="stylesheet" href="output.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    .qr-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      transition: box-shadow 0.2s, transform 0.15s;
    }

    .qr-card:hover {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      transform: translateY(-1px);
    }

    .qr-card img {
      width: 150px;
      height: 150px;
      image-rendering: pixelated;
    }

    .qr-card .qr-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1f2937;
      text-align: center;
    }

    .qr-card .qr-url {
      font-size: 0.65rem;
      color: #9ca3af;
      word-break: break-all;
      text-align: center;
      max-width: 180px;
    }

    .qr-actions {
      display: flex;
      gap: 0.35rem;
      width: 100%;
    }

    .qr-actions button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      padding: 0.45rem 0.6rem;
      min-height: 44px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
    }

    .btn-download {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-download:hover {
      background: #e5e7eb;
    }

    .btn-open {
      background: #ea580c;
      color: white;
    }

    .btn-open:hover {
      background: #c2410c;
    }

    /* Grid: responsive */
    .grid-qr {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    /* Mobile: 1 column */
    @media (max-width: 480px) {
      .grid-qr {
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }

      .qr-card {
        flex-direction: row;
        padding: 0.6rem;
        gap: 0.75rem;
      }

      .qr-card img {
        width: 90px;
        height: 90px;
      }

      .qr-card .qr-url {
        display: none;
      }

      .qr-actions {
        flex-direction: column;
        width: auto;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar-actions {
        justify-content: stretch;
      }

      .toolbar-actions button {
        flex: 1;
      }

      .search-input {
        width: 100%;
      }
    }

    /* Tablet: 2 columns */
    @media (min-width: 481px) and (max-width: 768px) {
      .grid-qr {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 0;
      gap: 1rem;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #fed7aa;
      border-top-color: #ea580c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .toolbar-actions {
      display: flex;
      gap: 0.4rem;
    }

    .btn-toolbar {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #d1d5db;
      background: white;
      color: #374151;
      transition: all 0.15s;
    }

    .btn-toolbar:hover {
      background: #f9fafb;
      border-color: #9ca3af;
    }

    .btn-toolbar.primary {
      background: #ea580c;
      color: white;
      border-color: #ea580c;
    }

    .btn-toolbar.primary:hover {
      background: #c2410c;
    }

    .search-input {
      padding: 0.4rem 0.8rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.8rem;
      width: 220px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: #ea580c;
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.1);
    }

    .counter-badge {
      background: #f3f4f6;
      color: #6b7280;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
    }

    /* Print styles */
    @media print {
      body {
        background: white !important;
      }

      header,
      .toolbar,
      .qr-actions,
      .btn-toolbar,
      .search-input {
        display: none !important;
      }

      .grid-qr {
        grid-template-columns: repeat(3, 1fr) !important;
        gap: 1rem !important;
      }

      .qr-card {
        break-inside: avoid;
        border: 2px solid #000 !important;
        box-shadow: none !important;
        padding: 0.75rem !important;
      }

      .qr-card img {
        width: 150px !important;
        height: 150px !important;
      }

      .qr-url {
        display: none !important;
      }
    }
  </style>
</head>

<body class="bg-gray-100">
  <header class="border-b border-[#c7c8c7] bg-white shadow-sm">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="rounded-lg">
            <img src="assets/image001.png" alt="logo" class="h-16 w-16 sm:h-20 sm:w-20 object-contain">
          </div>
          <div>
            <h1 class="text-lg sm:text-xl font-bold text_primary_color">QR Manager</h1>
            <p class="text-sm text_primary_color">Códigos QR de Troqueles</p>
          </div>
        </div>
        <a href="/"
          class="flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Volver al Formulario
        </a>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="flex items-center gap-3">
        <input type="text" id="search-input" class="search-input" placeholder="Buscar troquel...">
        <span id="counter-badge" class="counter-badge">0 troqueles</span>
      </div>
      <div class="toolbar-actions">
        <button id="btn-print" class="btn-toolbar">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          Imprimir Todos
        </button>
        <button id="btn-download-all" class="btn-toolbar primary">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          Descargar Todos
        </button>
      </div>
    </div>

    <!-- QR Grid -->
    <div id="qr-grid" class="grid-qr">
      <div class="loading-container" style="grid-column: 1 / -1;">
        <div class="spinner"></div>
        <p class="text-gray-500 font-medium">Generando códigos QR...</p>
      </div>
    </div>
  </main>

  <script>
    const grid = document.getElementById('qr-grid');
    const searchInput = document.getElementById('search-input');
    const counterBadge = document.getElementById('counter-badge');
    const btnDownloadAll = document.getElementById('btn-download-all');
    const btnPrint = document.getElementById('btn-print');

    let allTroqueles = [];

    async function loadQRCodes() {
      try {
        const response = await fetch('/api/troqueles/qr/batch');
        if (!response.ok) throw new Error('Error al cargar QR codes');

        allTroqueles = await response.json();
        renderCards(allTroqueles);
      } catch (error) {
        grid.innerHTML = '';
        const errorDiv = document.createElement('div');
        errorDiv.style.cssText = 'grid-column: 1 / -1; text-align: center; padding: 3rem;';
        errorDiv.innerHTML = `
            <p style="color: #ef4444; font-weight: 600; font-size: 1.1rem;">Error al cargar los códigos QR</p>
            <p style="color: #6b7280; margin-top: 0.5rem;">${error.message}</p>`;
        const retryBtn = document.createElement('button');
        retryBtn.className = 'btn-toolbar primary';
        retryBtn.style.margin = '1rem auto';
        retryBtn.textContent = 'Reintentar';
        retryBtn.addEventListener('click', loadQRCodes);
        errorDiv.appendChild(retryBtn);
        grid.appendChild(errorDiv);
      }
    }

    function renderCards(troqueles) {
      if (troqueles.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
            <p style="color: #6b7280; font-weight: 500;">No se encontraron troqueles</p>
          </div>`;
        counterBadge.textContent = '0 troqueles';
        return;
      }

      counterBadge.textContent = `${troqueles.length} troquel${troqueles.length !== 1 ? 'es' : ''}`;

      grid.innerHTML = troqueles.map(t => `
        <div class="qr-card" data-codigo="${t.codigo.toLowerCase()}" data-id="${t.idTroquel}">
          <div class="qr-label">${t.codigo}</div>
          <img src="${t.qr}" alt="QR ${t.codigo}">
          <div class="qr-actions">
            <button class="btn-download" data-qr="${t.qr}" data-codigo="${t.codigo}" title="Descargar QR">
              <svg style="width:14px;height:14px" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
              </svg>
              Descargar
            </button>
            <button class="btn-open" data-url="${t.url}" title="Abrir formulario">
              <svg style="width:14px;height:14px" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
              </svg>
              Abrir
            </button>
          </div>
        </div>
      `).join('');
    }

    function downloadQR(dataUrl, codigo) {
      const link = document.createElement('a');
      link.download = `QR-${codigo}.png`;
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Event delegation: handle clicks on download and open buttons inside the grid
    grid.addEventListener('click', (e) => {
      const downloadBtn = e.target.closest('.btn-download');
      const openBtn = e.target.closest('.btn-open');

      if (downloadBtn) {
        const qr = downloadBtn.dataset.qr;
        const codigo = downloadBtn.dataset.codigo;
        if (qr && codigo) downloadQR(qr, codigo);
      }

      if (openBtn) {
        const url = openBtn.dataset.url;
        if (url) window.open(url, '_blank');
      }
    });

    // Print button
    btnPrint.addEventListener('click', () => {
      window.print();
    });

    // Download all QRs as individual files
    btnDownloadAll.addEventListener('click', () => {
      allTroqueles.forEach((t, i) => {
        setTimeout(() => downloadQR(t.qr, t.codigo), i * 200);
      });
    });

    // Search filter
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (!query) {
        renderCards(allTroqueles);
        return;
      }
      const filtered = allTroqueles.filter(t => t.codigo.toLowerCase().includes(query));
      renderCards(filtered);
    });

    // Init
    loadQRCodes();
  </script>
</body>

</html>
