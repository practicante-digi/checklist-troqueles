<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Manager - Troqueles</title>
  <link rel="stylesheet" href="output.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    /* Ajustes generales */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .toolbar-actions { display: flex; gap: 0.5rem; }

    .search-input {
      padding: 0.5rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      width: 240px;
      outline: none;
      transition: all 0.15s;
    }

    .search-input:focus {
      border-color: #ff5c35;
      box-shadow: 0 0 0 3px rgba(255, 92, 53, 0.1);
    }

    .counter-badge {
      background: #f3f4f6;
      color: #6b7280;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
    }

    /* Botones de la barra de herramientas */
    .btn-toolbar {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-outline {
      background: white; border: 1px solid #d1d5db; color: #4b5563;
    }

    .btn-outline:hover {
      background: #f9fafb; color: #373a36; border-color: #9ca3af;
    }

    .btn-primary {
      background: #ff5c35; border: 1px solid #ff5c35; color: white;
    }

    .btn-primary:hover {
      background: #e04b28;
    }

    /* Tarjetas Minimalistas */
    .grid-qr {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
    }

    .qr-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s ease;
    }

    .qr-card:hover {
      border-color: #d1d5db;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      transform: translateY(-2px);
    }

    .qr-label {
      font-size: 1rem; font-weight: 700; color: #373a36; text-align: center;
    }

    .qr-image-wrapper {
      background: #f9fafb;
      border-radius: 0.5rem;
      padding: 0.75rem;
      margin: 1rem 0;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .qr-card img {
      width: 130px; height: 130px; image-rendering: pixelated; mix-blend-mode: multiply;
    }

    .qr-actions {
      display: flex; gap: 0.5rem; width: 100%;
    }

    .btn-action {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.35rem;
      padding: 0.5rem; border-radius: 0.375rem; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s; border: none;
      background: #f3f4f6; color: #6b7280;
    }

    .btn-action:hover { background: #e5e7eb; color: #373a36; }
    
    /* Efecto naranja sutil al pasar el mouse por el botón de abrir */
    .btn-action.action-open:hover { background: #fff0ec; color: #ff5c35; }

    /* Responsive Móvil */
    @media (max-width: 480px) {
      .grid-qr { grid-template-columns: 1fr; gap: 0.75rem; }
      .qr-card { flex-direction: row; padding: 0.75rem; }
      .qr-image-wrapper { width: auto; margin: 0 1rem 0 0; padding: 0.25rem; }
      .qr-card img { width: 70px; height: 70px; }
      .qr-card-content { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
      .qr-label { text-align: left; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .search-input { width: 100%; }
      .toolbar-actions button { flex: 1; justify-content: center; }
    }

    .loading-container { display: flex; flex-direction: column; align-items: center; padding: 4rem 0; gap: 1rem; }
    .spinner { width: 40px; height: 40px; border: 3px solid #ffedd5; border-top-color: #ff5c35; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Impresión limpia */
    @media print {
      body { background: white !important; }
      header, .toolbar, .qr-actions { display: none !important; }
      .grid-qr { grid-template-columns: repeat(4, 1fr) !important; gap: 1rem !important; }
      .qr-card { break-inside: avoid; border: 1px solid #d1d5db !important; padding: 1rem !important; box-shadow: none !important; }
      .qr-image-wrapper { background: white !important; margin: 0.5rem 0 !important; }
    }
  </style>
</head>

<body class="bg-gray-100">
  <header class="border-b border-[#c7c8c7] bg-white shadow-sm">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-row sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="rounded-lg">
            <img src="assets/image001.png" alt="logo" class="h-16 w-16 sm:h-20 sm:w-20 object-contain">
          </div>
          <div>
            <h1 class="text-lg sm:text-xl font-bold text_primary_color">QR Manager</h1>
            <p class="text-xs text_primary_color">Códigos QR de Troqueles</p>
          </div>
        </div>
        <a href="/"
          class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 transition-all">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Volver al Formulario
        </a>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="flex items-center gap-3">
        <input type="text" id="search-input" class="search-input" placeholder="Buscar troquel...">
        <span id="counter-badge" class="counter-badge">0 troqueles</span>
      </div>
      <div class="toolbar-actions">
        <button id="btn-print" class="btn-toolbar btn-outline">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
          Imprimir Todos
        </button>
        <button id="btn-download-all" class="btn-toolbar btn-primary">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          Descargar Todos
        </button>
      </div>
    </div>

    <!-- QR Grid -->
    <div id="qr-grid" class="grid-qr">
      <div class="loading-container" style="grid-column: 1 / -1;">
        <div class="spinner"></div>
        <p class="text-gray-500 font-medium">Generando códigos QR...</p>
      </div>
    </div>
  </main>

  <script>
    const grid = document.getElementById('qr-grid');
    const searchInput = document.getElementById('search-input');
    const counterBadge = document.getElementById('counter-badge');
    const btnDownloadAll = document.getElementById('btn-download-all');
    const btnPrint = document.getElementById('btn-print');

    let allTroqueles = [];

    async function loadQRCodes() {
      try {
        const response = await fetch('/api/troqueles/qr/batch');
        if (!response.ok) throw new Error('Error al cargar QR codes');

        allTroqueles = await response.json();
        renderCards(allTroqueles);
      } catch (error) {
        grid.innerHTML = '';
        const errorDiv = document.createElement('div');
        errorDiv.style.cssText = 'grid-column: 1 / -1; text-align: center; padding: 3rem;';
        errorDiv.innerHTML = `
            <p style="color: #ef4444; font-weight: 600; font-size: 1.1rem;">Error al cargar los códigos QR</p>
            <p style="color: #6b7280; margin-top: 0.5rem;">${error.message}</p>`;
        const retryBtn = document.createElement('button');
        retryBtn.className = 'btn-toolbar primary';
        retryBtn.style.margin = '1rem auto';
        retryBtn.textContent = 'Reintentar';
        retryBtn.addEventListener('click', loadQRCodes);
        errorDiv.appendChild(retryBtn);
        grid.appendChild(errorDiv);
      }
    }

    function renderCards(troqueles) {
      if (troqueles.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
            <p style="color: #6b7280; font-weight: 500;">No se encontraron troqueles</p>
          </div>`;
        counterBadge.textContent = '0 troqueles';
        return;
      }

      counterBadge.textContent = `${troqueles.length} troquel${troqueles.length !== 1 ? 'es' : ''}`;

      grid.innerHTML = troqueles.map(t => `
        <div class="qr-card" data-codigo="${t.codigo.toLowerCase()}" data-id="${t.idTroquel}">
          
          <div class="qr-image-wrapper">
            <img src="${t.qr}" alt="QR ${t.codigo}">
          </div>

          <div class="qr-card-content" style="width: 100%;">
            <div class="qr-label mb-3">${t.codigo}</div>
            
            <div class="qr-actions">
              <button class="btn-action btn-download" data-qr="${t.qr}" data-codigo="${t.codigo}" title="Descargar QR">
                <svg style="width:16px;height:16px" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                <span class="sm:hidden lg:inline">Descargar</span>
              </button>
              
              <button class="btn-action action-open btn-open" data-url="${t.url}" title="Abrir formulario">
                <svg style="width:16px;height:16px" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
                <span class="sm:hidden lg:inline">Abrir</span>
              </button>
            </div>
          </div>
          
        </div>
      `).join('');
    }

    function downloadQR(dataUrl, codigo) {
      const link = document.createElement('a');
      link.download = `QR-${codigo}.png`;
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Event delegation: handle clicks on download and open buttons inside the grid
    grid.addEventListener('click', (e) => {
      const downloadBtn = e.target.closest('.btn-download');
      const openBtn = e.target.closest('.btn-open');

      if (downloadBtn) {
        const qr = downloadBtn.dataset.qr;
        const codigo = downloadBtn.dataset.codigo;
        if (qr && codigo) downloadQR(qr, codigo);
      }

      if (openBtn) {
        const url = openBtn.dataset.url;
        if (url) window.open(url, '_blank');
      }
    });

    // Print button
    btnPrint.addEventListener('click', () => {
      window.print();
    });

    // Descargar todos los QRs en un archivo ZIP (Versión Definitiva)
    btnDownloadAll.addEventListener('click', async () => {
      if (allTroqueles.length === 0) return;

      // 1. Cambiamos el botón a estado de carga
      const originalText = btnDownloadAll.innerHTML;
      btnDownloadAll.innerHTML = `
        <div class="spinner" style="width: 16px; height: 16px; border-width: 2px; margin-right: 6px; display: inline-block; vertical-align: middle;"></div>
        Comprimiendo...
      `;
      btnDownloadAll.disabled = true;
      btnDownloadAll.style.opacity = '0.7';

      try {
        // 2. Inicializamos JSZip
        const zip = new JSZip();
        const imgFolder = zip.folder("QR_Troqueles");

        // 3. Procesamos cada imagen
        const promesasDescarga = allTroqueles.map(async (t) => {
          try {
            // Si el QR viene en formato Base64 (que es tu caso)
            if (t.qr.startsWith('data:image')) {
              // Extraemos solo el código de la imagen quitando la cabecera
              const base64Data = t.qr.split(',')[1];
              imgFolder.file(`QR-${t.codigo}.png`, base64Data, {base64: true});
            } 
            // Si por algún motivo viniera como URL normal (plan B)
            else {
              const respuesta = await fetch(t.qr);
              const blob = await respuesta.blob();
              imgFolder.file(`QR-${t.codigo}.png`, blob);
            }
          } catch (err) {
            console.error(`No se pudo agregar el QR de ${t.codigo}:`, err);
          }
        });

        // Esperamos a que TODAS las imágenes se hayan procesado
        await Promise.all(promesasDescarga);

        // 4. Generamos el archivo ZIP
        const content = await zip.generateAsync({type: "blob"});

        // 5. Forzamos la descarga del ZIP
        const url = window.URL.createObjectURL(content);
        const link = document.createElement('a');
        link.href = url;
        link.download = "Codigos_QR_Troqueles.zip";
        document.body.appendChild(link);
        link.click();
        
        // Limpieza de memoria
        document.body.removeChild(link);
        window.URL.revokeObjectURL(url);

      } catch (error) {
        console.error("Error al generar el ZIP:", error);
        alert("Hubo un error al generar el archivo ZIP. Intenta nuevamente.");
      } finally {
        // 6. Restauramos el botón a la normalidad
        btnDownloadAll.innerHTML = originalText;
        btnDownloadAll.disabled = false;
        btnDownloadAll.style.opacity = '1';
      }
    });

    // Init
    loadQRCodes();
  </script>
</body>

</html>
