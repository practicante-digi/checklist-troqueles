<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Planta - Sistema de Troqueles</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos inline críticos para asegurar pantalla completa absoluta */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: white;
        }
        #dashboard-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
    </style>
</head>
<body>
    <div id="dashboard-container"></div>
    <script src="dashboard.js"></script>
</body>
</html>
