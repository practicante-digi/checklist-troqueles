<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo Monitor - Pantalla Dinámica</title>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            color: #333;
        }

        .dashboard-container {
            display: flex;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            overflow: hidden;
            height: 100vh;
            align-items: center;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        .chart-section,
        .detail-section {
            flex: 1;
            padding: 1rem 2rem;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
        }

        .chart-section {
            border-right: 1px solid #e0e0e0;
        }

        .section-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #444;
            font-size: 1.25rem;
        }

        .section-subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 1.5rem;
        }

        /* ----- DISEÑO DEL TOOLTIP / TARJETA MINIMALISTA ----- */
        .detail-section {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .troquel-card {
            background: transparent;
            border-radius: 0px;
            padding: 1.5rem 2rem;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: relative;
            overflow: visible; /* Remover recorte para que el timer se vea recto e imperfecto */
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-header h2 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            color: #111;
            letter-spacing: -0.02em;
        }

        .image-box {
            width: 100%;
            height: 200px;
            background: #ffffff;
            border: none;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .image-box img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        /* Datos tipográficos */
        .data-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            gap: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f0f0f0;
        }

        .stat-block {
            flex: 1;
        }

        .data-label {
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #868e96;
        }

        .data-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #212529;
            margin-top: 0.2rem;
        }

        .text-dark {
            color: #343a40;
        }

        .text-red {
            color: #fa5252;
        }

        /* Barra de Progreso Inferior */
        .timer-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: #f1f3f5;
        }

        .timer-bar {
            height: 100%;
            background: rgba(255, 82, 82, 0.8);
            width: 0%;
            border-radius: 0 4px 4px 0;
            /* La transición CSS hará la magia de los 30 seg */
        }

        /* Contenedor relativo y Puntero de Enfoque */
        #chart-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 400px;
        }

        .bar-pointer {
            position: absolute;
            right: -25px; /* Apuntando desde la tarjeta hacia la gráfica */
            width: 0; 
            height: 0; 
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent; 
            border-right: 22px solid #343a40; 
            transition: top 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), border-right-color 0.4s ease;
            transform: translateY(-50%);
            z-index: 100;
            opacity: 0; 
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Lado Izquierdo: Gráfico Horizonatal interactivo -->
        <div class="chart-section">
            <div class="section-title">Estado de Troqueles</div>
            <div id="chart-wrapper">
                <div id="chart-container"></div>
                <div id="bar-pointer" class="bar-pointer"></div>
            </div>
        </div>

        <!-- Lado Derecho: Tarjeta Dinámica Focus -->
        <div class="detail-section">
            <div class="troquel-card" id="active-card">
                <div class="card-header">
                    <h2 id="card-title">Cargando...</h2>
                    <div id="card-status-badge" style="display: none; align-items: center; padding: 0.4rem 0.8rem; border-radius: 8px; font-weight: 700; font-size: 0.9rem; transition: background 0.3s, color 0.3s;">
                        <span id="card-status-icon" style="font-size: 1.1rem; margin-right: 4px;"></span> 
                        <span id="card-status-text"></span>
                    </div>
                </div>

                <div class="image-box">
                    <img id="card-image" src="" alt="Imagen del Troquel">
                </div>

                <div class="data-group">
                    <div class="data-label">Número de parte (Material)</div>
                    <div class="data-value" id="card-material">--</div>
                </div>

                <div class="stats-row">
                    <div class="stat-block">
                        <div class="data-label">Por producir</div>
                        <div class="data-value text-red" id="card-por-producir">--</div>
                    </div>
                    <div class="stat-block">
                        <div class="data-label">Producidas</div>
                        <div class="data-value text-dark" id="card-producidas">--</div>
                    </div>
                </div>

                <div class="timer-bar-container">
                    <div class="timer-bar" id="timer-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let myChart = null;
            let topData = null; // Guardará el top 15 invertido (para echarts)

            // Constantes
            const TIMER_MS = 20000; // 20 segundos         
            const formatNumber = (num) => new Intl.NumberFormat('es-MX').format(num);

            try {
                // Obtener datos
                const response = await fetch('/api/monitor/datos');
                if (!response.ok) throw new Error('Error al contactar al backend');
                const rawData = await response.json();

                // Extraemos el TOP 10 y los invertimos para ECharts (El objeto Index 9 es el que está hasta arriba MÁS grande)
                topData = [...rawData].slice(0, 10).reverse();

                // Inicializar ECharts
                const chartDom = document.getElementById('chart-container');
                chartDom.style.height = '100%';
                myChart = echarts.init(chartDom);

                // Empezamos desde el extremo final del array porque ECharts dibuja el Index length-1 hasta arriba
                let currentIndex = topData.length - 1;

                // Función maestra que actualiza la Tarjeta y destaca el Gráfico
                function focusTroquel() {
                    const item = topData[currentIndex];

                    // 1. Textos
                    document.getElementById('card-title').innerText = item.id;
                    document.getElementById('card-material').innerText = item.material;
                    document.getElementById('card-producidas').innerText = formatNumber(item.produc);
                    document.getElementById('card-por-producir').innerText = formatNumber(item.porProducir);
                    
                    // Alertas Mantenimiento en Tarjeta (Dinámico)
                    const statusBadge = document.getElementById('card-status-badge');
                    const statusIcon = document.getElementById('card-status-icon');
                    const statusText = document.getElementById('card-status-text');

                    if (item.percentage >= 100) {
                        statusBadge.style.display = 'flex';
                        statusBadge.style.background = '#ffe3e3';
                        statusBadge.style.color = '#fa5252';
                        statusIcon.innerText = '⚠️';
                        statusText.innerText = 'CRÍTICO';
                    } else if (item.percentage >= 80) {
                        statusBadge.style.display = 'flex';
                        statusBadge.style.background = '#fff4e6'; // Fondo Naranja Claro
                        statusBadge.style.color = '#fd7e14'; // Naranja Echarts
                        statusIcon.innerText = '🔔';
                        statusText.innerText = 'EN RIESGO';
                    } else {
                        statusBadge.style.display = 'none';
                    }

                    // 2. Imagen (Manejo de errores por JS en lugar de atributo HTML por CSP)
                    const imgEl = document.getElementById('card-image');
                    imgEl.onerror = function () {
                        this.src = "data:image/svg+xml;utf8,<svg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'><rect width='100' height='100' fill='%23f8f9fa'/><text x='50' y='50' dominant-baseline='middle' text-anchor='middle' font-size='12' font-family='sans-serif' fill='%23adb5bd'>Sin Imagen</text></svg>";
                    };
                    imgEl.src = `/api/troqueles/imagen/${item.material}`;

                    // 3. Reiniciar la barra animada
                    const bar = document.getElementById('timer-bar');
                    bar.style.transition = 'none';
                    bar.style.width = '0%';

                    // Establecer color de resalte principal
                    let uiColor = '#343a40';
                    if (item.percentage >= 100) uiColor = '#fa5252';
                    else if (item.percentage >= 80) uiColor = '#fd7e14';

                    // Trigger reflow y posicionar el cordón umbilical SVG
                    setTimeout(() => {
                        bar.style.transition = `width ${TIMER_MS}ms linear`;
                        bar.style.width = '100%';

                        // Interpolamos el X solo por si acaso, aunque a la flecha le interesa netamente la coordenada Y visual.
                        const renderedPercentage = Math.min(item.percentage, 100);
                        const pixels = myChart.convertToPixel({seriesIndex: 0}, [renderedPercentage, currentIndex]);
                        
                        if (pixels) {
                            const pointer = document.getElementById('bar-pointer');
                            pointer.style.top = `${pixels[1]}px`;
                            pointer.style.opacity = '1';
                            
                            // Pintar la flecha del mismo color de criticidad
                            pointer.style.borderRightColor = uiColor;
                        }
                    }, 80);

                    // 4. Actualizar el Gráfico para Resaltar la barra seleccionada
                    myChart.setOption({
                        grid: { left: '2%', right: '12%', bottom: '1%', top: '2%', containLabel: true },
                        xAxis: { type: 'value', max: 100, splitLine: { show: false }, axisLabel: { show: false }, axisTick: { show: false }, axisLine: { show: false } },
                        yAxis: {
                            type: 'category',
                            data: topData.map(d => d.id),
                            axisLine: { show: false }, axisTick: { show: false },
                            axisLabel: { color: '#555', fontFamily: 'Segoe UI', fontWeight: 600, fontSize: 18, margin: 15 }
                        },
                        series: [{
                            type: 'bar',
                            barWidth: '40%',
                            showBackground: true,
                            backgroundStyle: { color: '#e9ecef', borderRadius: 6 },
                            data: topData.map((d, index) => {
                                const isActive = index === currentIndex;

                                let baseColor = '#343a40';

                                if (d.percentage >= 100) {
                                    baseColor = '#fa5252';
                                } else if (d.percentage >= 80) {
                                    baseColor = '#fd7e14';
                                }

                                return {
                                    value: d.percentage,
                                    itemStyle: {
                                        color: baseColor,
                                        opacity: isActive ? 1 : 0.35,
                                        borderRadius: 6
                                    },
                                    label: {
                                        show: true,
                                        position: 'right', 
                                        distance: 8,
                                        formatter: (params) => Math.round(params.value) + '%',
                                        color: isActive ? baseColor : '#888',
                                        fontSize: isActive ? 16 : 14,
                                        fontWeight: isActive ? 800 : 600
                                    }
                                };
                            }),
                            markLine: {
                                symbol: 'none',
                                data: [{ xAxis: 85 }],
                                lineStyle: { color: 'rgba(255, 82, 82, 0.4)', type: 'solid', width: 2 },
                                label: { show: false }
                            }
                        }]
                    });
                }

                // Arrancamos ciclo
                focusTroquel();
                setInterval(() => {
                    currentIndex--; // Bajamos un nivel (visualmente en ECharts esto es bajar una barra)
                    if (currentIndex < 0) {
                        currentIndex = topData.length - 1; // Volver hasta arriba
                    }
                    focusTroquel();
                }, TIMER_MS);

                window.addEventListener('resize', () => { 
                    myChart.resize(); 
                    focusTroquel(); // Recalcular la curva
                });

            } catch (error) {
                console.error("Hubo un fallo cargando el monitor dinámico:", error);
                document.getElementById('card-title').innerText = "Demasiado estático";
                document.getElementById('card-material').innerText = "Fallo de comunicación DB";
            }
        });
    </script>
</body>

</html>
